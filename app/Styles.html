<style>
  /* =====================================================================
     AlphaTrack design system · Owner: Member 5 (shared by every page)
     ===================================================================== */
  :root {
    --bg: #F3F5F9;
    --surface: #FFFFFF;
    --surface-2: #F8FAFC;
    --surface-3: #F1F4F9;
    --border: #E3E8EF;
    --border-strong: #CBD3DF;
    --ink: #0E1726;
    --ink-2: #1F2A3B;
    --ink-3: #3A4659;
    --muted: #5A6678;
    --brand: #2B50D8;
    --brand-hover: #2142B8;
    --brand-press: #1B379A;
    --brand-soft: #EEF2FF;
    --brand-soft-2: #DFE6FF;
    --brand-ink: #1E3A8A;
    --side: #0B1220;
    --side-2: #131C2E;
    --side-ink: #A9B4C8;
    --ok: #0B6B4F;     --ok-soft: #E3F5EC;
    --warn: #8A4B00;   --warn-soft: #FFF2D6;
    --info: #1D4ED8;   --info-soft: #E8EFFE;
    --danger: #B42318; --danger-soft: #FEECEB;
    --viz-1: #86B6EF; --viz-2: #3987E5; --viz-3: #1C5CAB; --viz-4: #0D366B; --viz-track: #E3EDFB;
    --r-sm: 8px; --r: 12px; --r-lg: 16px; --r-xl: 20px;
    --shadow-xs: 0 1px 2px rgba(16, 24, 40, 0.05);
    --shadow-sm: 0 1px 3px rgba(16, 24, 40, 0.07), 0 1px 2px rgba(16, 24, 40, 0.04);
    --shadow-md: 0 10px 24px -8px rgba(16, 24, 40, 0.14), 0 2px 6px rgba(16, 24, 40, 0.05);
    --shadow-lg: 0 28px 56px -16px rgba(16, 24, 40, 0.32);
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --t1: 120ms; --t2: 200ms; --t3: 360ms;
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font: 14.5px/1.55 var(--font); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  a { color: var(--brand); text-decoration: none; }
  a:hover { color: var(--brand-hover); text-decoration: underline; }
  h1, h2, h3, h4, p { margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  .sidebar :focus-visible { outline-color: #7D97FF; }
  #content:focus { outline: none; }
  [hidden] { display: none !important; }
  .visually-hidden { position: absolute; top: 0; left: 0; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .num { font-variant-numeric: tabular-nums; }
  svg.i { flex: 0 0 auto; display: block; }

  /* ---------------------------------------------------------- Motion */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeOut { to { opacity: 0; } }
  @keyframes popIn { from { opacity: 0; transform: translateY(10px) scale(0.97); } to { opacity: 1; transform: none; } }
  @keyframes popOut { to { opacity: 0; transform: translateY(6px) scale(0.98); } }
  @keyframes slideFromRight { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
  @keyframes slideFromLeft { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
  @keyframes growX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes ripple { from { transform: scale(0); opacity: 0.32; } to { transform: scale(1); opacity: 0; } }
  @keyframes shimmer { to { background-position: -200% 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes indeterminate { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  .enter { animation: fadeUp var(--t3) var(--ease-out) both; }
  .enter-right { animation: slideFromRight var(--t3) var(--ease-out) both; }
  .enter-left { animation: slideFromLeft var(--t3) var(--ease-out) both; }
  .stagger > * { animation: fadeUp var(--t3) var(--ease-out) both; animation-delay: calc(var(--i, 0) * 40ms); }
  /* Re-renders of a view that is already on screen skip the entrance motion. */
  .no-anim .stagger > *, .no-anim .progress-fill, .no-anim .enter { animation: none; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; scroll-behavior: auto !important; }
  }

  /* ----------------------------------------------------------- Shell */
  .app { display: flex; min-height: 100vh; }
  .sidebar { flex: 0 0 268px; width: 268px; background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; z-index: 40; }
  .brand { display: flex; align-items: center; gap: 12px; padding: 22px 20px 18px; }
  .side-close { display: none; margin-left: auto; color: #C9D2E3; background: transparent; border-color: transparent; }
  .side-close:hover:not(:disabled) { background: rgba(255, 255, 255, 0.08); color: #FFFFFF; }
  .brand-mark { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 11px; background: var(--brand); display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px -6px rgba(43, 80, 216, 0.8); }
  .brand-name { color: #FFFFFF; font-weight: 800; font-size: 19px; letter-spacing: -0.02em; line-height: 1.1; }
  .brand-tag { font-size: 12px; color: #8E9AB0; margin-top: 3px; line-height: 1.35; }
  .nav { flex: 1 1 auto; overflow-y: auto; padding: 6px 12px 12px; display: flex; flex-direction: column; gap: 2px; }
  .nav-group { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #8592A8; padding: 16px 12px 6px; }
  .nav-item { position: relative; display: flex; align-items: center; gap: 11px; width: 100%; min-height: 42px; padding: 9px 12px; border: 0; border-radius: 10px; background: transparent; color: var(--side-ink); text-align: left; cursor: pointer; font-size: 14px; font-weight: 500; overflow: hidden; transition: background var(--t2) var(--ease), color var(--t2) var(--ease); }
  .nav-item:hover { background: var(--side-2); color: #FFFFFF; }
  .nav-item[aria-current="page"] { background: rgba(43, 80, 216, 0.22); color: #FFFFFF; font-weight: 600; }
  .nav-item[aria-current="page"]::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: #7D97FF; animation: fadeIn var(--t2) var(--ease) both; }
  .nav-label { flex: 1 1 auto; line-height: 1.3; }
  .nav-owner { flex: 0 0 auto; font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: rgba(255, 255, 255, 0.06); color: #8592A8; }
  .nav-item[aria-current="page"] .nav-owner { background: rgba(255, 255, 255, 0.14); color: #DCE3F5; }
  .side-foot { padding: 14px 14px 18px; border-top: 1px solid #1A2438; display: flex; flex-direction: column; gap: 10px; }
  .side-link { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; color: var(--side-ink); font-size: 13px; font-weight: 500; }
  .side-link:hover { background: var(--side-2); color: #FFFFFF; text-decoration: none; }
  .user-card { display: flex; align-items: center; gap: 10px; padding: 8px 10px; }
  .user-meta { min-width: 0; }
  .user-name { color: #E3E8F2; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-role { color: #7F8BA0; font-size: 11.5px; }
  .avatar { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-ink); font-weight: 700; font-size: 12.5px; letter-spacing: 0.02em; }
  .avatar.lg { width: 56px; height: 56px; font-size: 18px; border-radius: 16px; }
  .avatar.side { background: #22304A; color: #DCE3F5; }
  .main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  .topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; padding: 12px 32px; background: rgba(255, 255, 255, 0.88); backdrop-filter: saturate(160%) blur(10px); -webkit-backdrop-filter: saturate(160%) blur(10px); border-bottom: 1px solid var(--border); }
  .crumbs { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); min-width: 0; white-space: nowrap; }
  .crumbs strong { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar-spacer { flex: 1 1 auto; }
  .search { position: relative; width: min(340px, 34vw); }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search input { width: 100%; min-height: 40px; padding: 8px 12px 8px 38px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); font-size: 13.5px; transition: border-color var(--t2), box-shadow var(--t2), background var(--t2); }
  .search input:focus { outline: none; background: #FFFFFF; border-color: var(--brand); box-shadow: 0 0 0 4px rgba(43, 80, 216, 0.14); }
  .date-pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
  .topbar .menu-btn { display: none; }
  .content { padding: 28px 32px 56px; max-width: 1400px; width: 100%; margin: 0 auto; }
  .banner { display: flex; gap: 12px; align-items: flex-start; padding: 13px 16px; border-radius: var(--r); font-size: 14px; margin: 18px 32px 0; animation: fadeUp var(--t3) var(--ease-out) both; }
  .banner.warn { background: var(--warn-soft); color: #5A3D00; border: 1px solid #F3D9A4; }
  .banner.error { background: var(--danger-soft); color: #7A1D14; border: 1px solid #F5C2BC; }
  .scrim { display: none; }

  /* ------------------------------------------------------------ Page */
  .page { display: flex; flex-direction: column; gap: 22px; }
  .page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--brand); margin-bottom: 6px; }
  .page-title { font-size: 28px; line-height: 1.2; font-weight: 750; letter-spacing: -0.025em; color: var(--ink); }
  .page-sub { color: var(--muted); margin-top: 6px; max-width: 760px; font-size: 14.5px; }
  .head-actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); }
  .card-pad { padding: 20px 22px; }
  .card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 22px 0; }
  .card-head > div:first-child { flex: 1 1 200px; min-width: 0; }
  .card-head.ruled { padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .card-title { font-size: 15.5px; font-weight: 650; letter-spacing: -0.01em; color: var(--ink); }
  .card-sub { font-size: 13px; color: var(--muted); }
  .card-body { padding: 16px 22px 20px; }
  .lift { transition: transform var(--t2) var(--ease), box-shadow var(--t2) var(--ease), border-color var(--t2) var(--ease); }
  .lift:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .section-gap { display: flex; flex-direction: column; gap: 20px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  .grid-3-1 { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(320px, 1fr); gap: 20px; align-items: start; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }

  /* --------------------------------------------------------- Buttons */
  .btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid transparent; font-size: 14px; font-weight: 600; letter-spacing: -0.005em; cursor: pointer; white-space: nowrap; user-select: none; transition: background var(--t2) var(--ease), border-color var(--t2) var(--ease), color var(--t2) var(--ease), box-shadow var(--t2) var(--ease), transform var(--t1) var(--ease); }
  .btn:hover { text-decoration: none; }
  .btn:active:not(:disabled) { transform: scale(0.97); }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .btn-primary { background: var(--brand); color: #FFFFFF; box-shadow: 0 1px 2px rgba(16, 24, 40, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.12); }
  .btn-primary:hover:not(:disabled) { background: var(--brand-hover); color: #FFFFFF; box-shadow: 0 6px 16px -6px rgba(43, 80, 216, 0.65); }
  .btn-primary:active:not(:disabled) { background: var(--brand-press); }
  .btn-secondary { background: var(--surface); color: var(--ink-2); border-color: var(--border-strong); box-shadow: var(--shadow-xs); }
  .btn-secondary:hover:not(:disabled) { background: var(--surface-2); border-color: #B7C1D0; color: var(--ink); }
  .btn-ghost { background: transparent; color: var(--brand); padding: 0 12px; }
  .btn-ghost:hover:not(:disabled) { background: var(--brand-soft); color: var(--brand-hover); }
  .btn-danger { background: var(--surface); color: var(--danger); border-color: #F5C2BC; }
  .btn-danger:hover:not(:disabled) { background: var(--danger-soft); }
  .btn-sm { min-height: 34px; padding: 0 12px; font-size: 13px; border-radius: 9px; gap: 6px; }
  .btn-icon { min-height: 38px; width: 38px; padding: 0; }
  .ripple { position: absolute; border-radius: 50%; background: currentColor; pointer-events: none; animation: ripple 560ms var(--ease-out) forwards; }
  .link-btn { background: none; border: 0; padding: 0; color: var(--ink); font-weight: 650; cursor: pointer; text-align: left; transition: color var(--t2); }
  .link-btn:hover { color: var(--brand); }
  .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin 0.7s linear infinite; display: inline-block; flex: 0 0 auto; }

  /* ----------------------------------------------------------- Chips */
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; line-height: 20px; transition: background var(--t2), color var(--t2); }
  .chip svg { width: 13px; height: 13px; }
  .chip-dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: 0 0 auto; }
  .chip-live::before { animation: pulseDot 1.6s ease-in-out infinite; }
  .st-draft { background: #EEF1F6; color: #475569; }
  .st-pending-docs { background: var(--warn-soft); color: var(--warn); }
  .st-pending-ver { background: var(--info-soft); color: var(--info); }
  .st-active { background: var(--ok-soft); color: var(--ok); }
  .crit-HIGH { background: var(--danger-soft); color: var(--danger); }
  .crit-MEDIUM { background: var(--warn-soft); color: var(--warn); }
  .crit-LOW { background: #EEF1F6; color: #475569; }
  .cls-CONTRACT { background: #F1EBFB; color: #5B3596; }
  .cls-LICENCE { background: #E3F4F5; color: #0E6A73; }
  .cls-CERTIFICATE { background: #E9EFFD; color: #1E40AF; }
  .chip-neutral { background: #EEF1F6; color: #475569; }
  .chip-mandatory { background: var(--ink); color: #FFFFFF; }
  .chip-optional { background: #EEF1F6; color: #475569; }
  .chip-brand { background: var(--brand-soft); color: var(--brand-ink); }
  .ex-queued { background: var(--info-soft); color: var(--info); }
  .ex-ok { background: var(--ok-soft); color: var(--ok); }
  .ex-bad { background: var(--danger-soft); color: var(--danger); }
  .ex-none { background: #EEF1F6; color: #475569; }
  .tile-icon { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 11px; }
  .tone-brand { background: var(--brand-soft); color: var(--brand); }
  .tone-ok { background: var(--ok-soft); color: var(--ok); }
  .tone-warn { background: var(--warn-soft); color: var(--warn); }
  .tone-info { background: var(--info-soft); color: var(--info); }
  .tone-danger { background: var(--danger-soft); color: var(--danger); }
  .tone-neutral { background: #EEF1F6; color: #475569; }
  .tone-CONTRACT { background: #F1EBFB; color: #5B3596; }
  .tone-LICENCE { background: #E3F4F5; color: #0E6A73; }
  .tone-CERTIFICATE { background: #E9EFFD; color: #1E40AF; }

  /* ----------------------------------------------------------- Forms */
  .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 22px; }
  .form-grid .full { grid-column: 1 / -1; }
  .field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .field-label { font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
  .req-mark { color: var(--danger); }
  .hint { font-size: 12.5px; color: var(--muted); }
  .input, .select, .textarea { width: 100%; min-height: 42px; padding: 9px 13px; border: 1px solid var(--border-strong); border-radius: 10px; background: #FFFFFF; font-size: 14px; box-shadow: var(--shadow-xs); transition: border-color var(--t2) var(--ease), box-shadow var(--t2) var(--ease); }
  .textarea { min-height: 80px; resize: vertical; }
  .input:hover, .select:hover, .textarea:hover { border-color: #B7C1D0; }
  .input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px rgba(43, 80, 216, 0.14); }
  .input.invalid, .select.invalid, .textarea.invalid { border-color: var(--danger); box-shadow: 0 0 0 4px rgba(180, 35, 24, 0.10); }
  .error-text { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--danger); font-weight: 500; animation: fadeUp var(--t2) var(--ease-out) both; }
  .seg { display: flex; flex-wrap: wrap; gap: 10px; }
  .seg label { flex: 1 1 160px; display: flex; flex-direction: column; gap: 2px; min-height: 44px; padding: 11px 14px; border: 1px solid var(--border-strong); border-radius: 12px; cursor: pointer; background: #FFFFFF; transition: border-color var(--t2), background var(--t2), box-shadow var(--t2); }
  .seg label:hover { border-color: #A9B6C9; }
  .seg .seg-top { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 14px; }
  .seg .seg-sub { font-size: 12.5px; color: var(--muted); padding-left: 24px; }
  .seg input { accent-color: var(--brand); width: 16px; height: 16px; margin: 0; }
  .seg label:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); box-shadow: 0 0 0 3px rgba(43, 80, 216, 0.10); }
  .switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13px; font-weight: 600; min-height: 36px; user-select: none; }
  .switch input { appearance: none; -webkit-appearance: none; position: relative; width: 38px; height: 22px; margin: 0; border-radius: 999px; background: #CBD3DF; cursor: pointer; transition: background var(--t2) var(--ease); flex: 0 0 auto; }
  .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(16, 24, 40, 0.25); transition: transform var(--t2) var(--ease-out); }
  .switch input:checked { background: var(--brand); }
  .switch input:checked::after { transform: translateX(16px); }
  .switch input:focus-visible { outline: 3px solid rgba(43, 80, 216, 0.45); outline-offset: 2px; }

  /* ---------------------------------------------------------- Tables */
  .table-wrap { position: relative; overflow-x: auto; }
  table.data { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
  table.data th { text-align: left; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); background: var(--surface-2); padding: 11px 13px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.data td { padding: 13px 13px; border-bottom: 1px solid #EEF2F6; vertical-align: middle; transition: background var(--t2) var(--ease); }
  table.data tbody tr:last-child td { border-bottom: 0; }
  table.data tbody tr.clickable { cursor: pointer; }
  table.data tbody tr.clickable:hover td { background: #F7F9FF; }
  table.data tbody tr.clickable td:last-child { position: relative; }
  .cell-split { display: flex; align-items: center; justify-content: space-between; gap: 10px; white-space: nowrap; }
  .chip-off { background: var(--surface-3); color: var(--ink-3); }
  tr.is-deactivated td { color: var(--muted); }
  tr.is-deactivated .avatar, tr.is-deactivated .cat .tile-icon, tr.is-deactivated .progress, tr.is-deactivated .chip:not(.chip-off) { opacity: 0.55; filter: grayscale(1); }
  .row-go { color: #A3AEC0; transition: transform var(--t2) var(--ease), color var(--t2); }
  tr.clickable:hover .row-go { color: var(--brand); transform: translateX(3px); }
  .who { display: flex; align-items: center; gap: 12px; min-width: 196px; }
  .cell-main { font-weight: 650; color: var(--ink); }
  .cell-sub { font-size: 12.5px; color: var(--muted); }
  .cat { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-3); white-space: nowrap; }
  .cat .tile-icon { width: 28px; height: 28px; border-radius: 8px; }
  .progress { display: flex; align-items: center; gap: 10px; min-width: 120px; }
  .progress-bar { flex: 1 1 auto; height: 7px; border-radius: 999px; background: #E7ECF3; overflow: hidden; }
